apiVersion: v1
kind: query
spec:
  automations_enabled: false
  description: Monitor usage of Reg, a Windows utility used to interact with the Windows Registry - ATT&CK T1112
  discard_data: false
  interval: 600
  name: MITRE - Registry Modification
  observer_can_run: false
  platform: "windows"
  query: select * from file WHERE directory = 'C:\Windows\Prefetch\' and filename like '%reg%';
---
apiVersion: v1
kind: query
spec:
  automations_enabled: false
  description: Monitor usage of Regedit, a Windows utility used to interact with the Windows Registry - ATT&CK T1112
  discard_data: false
  interval: 600
  name: MITRE - Registry Editor
  observer_can_run: false
  platform: "windows"
  query: select * from file WHERE directory = 'C:\Windows\Prefetch\' and filename like '%regedit%';
